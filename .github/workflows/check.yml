name: macOS example build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=768
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:mac
